<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Cpath fill='%23231815' fill-rule='evenodd' d='M200 0A200 200 0 1 1 200 400A200 200 0 1 1 200 0ZM265.5,323.2h-67.6c-35-.3-63.6-26.3-63.8-57.9v-129.4c.2-32.7,29.7-59.2,65.7-59.2s65.5,26.6,65.7,59.2v75.4s0,3.6,0,3.6h-80.6v50.3c0,17.2,15.6,31,34.7,31,0,0,0,0,.2,0h25.2s16.9,0,16.9,0h3.6v26.9ZM184.9,188h29.8v-72.6c0-7.2-6.7-13.1-14.9-13.1s-14.9,5.9-14.9,13.1v72.6Z'/%3E%3C/svg%3E">
<title>商發部設計需求單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a production job-ticket — form on the left, a perforated "ticket stub" on the right
   that live-computes the case level (D+n working days) and the weekly intake cutoff. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eef1f5; --ink:#141b26; --ink-2:#465264; --ink-3:#737f92;
  --line:#dde2ea; --line-2:#c6cdd8;
  --accent:#1d5bcc; --accent-hover:#164aa8; --accent-ink:#ffffff; --accent-soft:#e3ebfa;
  --series:#2a78d6; --grid:#e6e9ee;
  --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b; --st-muted:#9aa3b2;
  --crit-ink:#b42323; --warn-ink:#8a5a00; --good-ink:#0a7a0a;
  --c:#00a0e3; --m:#e4007f; --y:#f2cf00;
  --shadow:0 18px 50px -12px rgba(20,27,38,.28);
  --f-display:"Archivo","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131a; --surface:#161d27; --surface-2:#1c2531; --ink:#e8ecf2; --ink-2:#aab4c2; --ink-3:#7f8a9a;
    --line:#29323f; --line-2:#3a4555;
    --accent:#6c9ef2; --accent-hover:#8bb3f6; --accent-ink:#0b1220; --accent-soft:#1a2942;
    --series:#3987e5; --grid:#252e3a;
    --st-muted:#6b7585; --crit-ink:#f08585; --warn-ink:#f5c454; --good-ink:#5fd15f;
    --shadow:0 18px 50px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#161d27; --surface-2:#1c2531; --ink:#e8ecf2; --ink-2:#aab4c2; --ink-3:#7f8a9a;
  --line:#29323f; --line-2:#3a4555;
  --accent:#6c9ef2; --accent-hover:#8bb3f6; --accent-ink:#0b1220; --accent-soft:#1a2942;
  --series:#3987e5; --grid:#252e3a;
  --st-muted:#6b7585; --crit-ink:#f08585; --warn-ink:#f5c454; --good-ink:#5fd15f;
  --shadow:0 18px 50px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px 20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:block;height:36px;width:36px;flex:none;color:var(--ink)}
.gate-card .logo{height:44px}
.cmyk i{display:block;width:9px;height:9px;border-radius:2px}
.brand h1{font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:.02em}
.brand small{display:block;color:var(--ink-3);font-size:12px;line-height:1.3}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;color:var(--ink-2);font-size:14px;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tab .lk{font-size:10px;font-weight:700;letter-spacing:.06em;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.75}
.who{font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.who b{color:var(--ink)}

main{padding-block:24px 64px}
.view{display:grid;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.page-head h2{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:.01em}
.sub{color:var(--ink-2);font-size:14px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.notice{border-radius:10px;padding:12px 16px;font-size:14px;border:1px solid var(--line);background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.notice b{white-space:nowrap}
.notice.warn{border-color:color-mix(in srgb,var(--st-warn) 55%,var(--line));background:color-mix(in srgb,var(--st-warn) 10%,var(--surface))}
.notice.info{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.notice.demo{border-style:dashed;border-color:var(--accent);background:var(--accent-soft)}

/* buttons */
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--crit-ink);border-color:color-mix(in srgb,var(--st-crit) 45%,var(--line))}
.btn.danger.armed{background:var(--st-crit);border-color:var(--st-crit);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.block{width:100%;padding:12px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{appearance:none;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px;font-weight:600}

/* forms */
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.form-main{display:grid;gap:16px;min-width:0}
.fsec{display:grid;gap:16px}
.fs-h{font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.fs-h span{font-size:12px;font-weight:500;color:var(--ink-3)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 16px}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.req::after{content:" *";color:var(--crit-ink)}
.hint{font-size:12px;color:var(--ink-3);line-height:1.5}
.err{font-size:12px;color:var(--crit-ink);font-weight:600}
input[type=text],input[type=date],input[type=number],input[type=url],input[type=search],input[type=time],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
[aria-invalid="true"]{border-color:var(--st-crit)!important}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cat{position:relative;display:grid;gap:2px;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.cat:hover{border-color:var(--accent)}
.cat input{position:absolute;opacity:0;pointer-events:none}
.cat b{font-size:14px}
.cat small{font-size:12px;color:var(--ink-3);line-height:1.45}
.cat:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.cat:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.cats.invalid .cat{border-color:var(--st-crit)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;background:var(--surface);user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.chips.invalid .chip{border-color:var(--st-crit)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.preset{appearance:none;border:1px dashed var(--line-2);background:transparent;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:6px}
.preset:hover{border-color:var(--accent);color:var(--accent)}
.preset .mono{font-size:11.5px}
.qty{display:flex;align-items:center;gap:8px}
.qty input{width:110px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent);flex:none}

/* ticket stub */
.stub{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid}
.stub-head{background:var(--ink);color:var(--surface);padding:12px 18px;display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em}
.stub-sec{padding:16px 18px;display:grid;gap:6px}
.stub-k{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-3)}
.dn{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dn-big{font-family:var(--f-display);font-size:52px;font-weight:800;line-height:1;letter-spacing:-.01em}
.stub-p{font-size:13px;color:var(--ink-2);line-height:1.55}
.perf{position:relative;border-top:1.5px dashed var(--line-2);margin-inline:14px}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-25px}.perf::after{right:-25px}
.stub-foot{padding:16px 18px 18px;display:grid;gap:10px}
.errbox{font-size:13px;color:var(--crit-ink);display:grid;gap:2px}
.flag{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5}
.flag i{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;margin-top:1px;color:#fff}
.flag.ok i{background:var(--st-good)}
.flag.bad i{background:var(--st-serious)}
.rules ol{margin:6px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px;color:var(--ink-2)}
.rules h3{font-size:14px}
.success{display:grid;gap:14px;justify-items:start;max-width:620px}
.success .tk{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:.04em}

/* pills */
.pill{--tone:var(--st-muted);display:inline-flex;align-items:center;gap:6px;padding:1px 10px 1px 8px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--tone) 16%,var(--surface));white-space:nowrap;line-height:1.7}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tone);flex:none}
.t-good{--tone:var(--st-good)}.t-warn{--tone:var(--st-warn)}.t-serious{--tone:var(--st-serious)}.t-crit{--tone:var(--st-crit)}.t-info{--tone:var(--accent)}.t-muted{--tone:var(--st-muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border:1px solid var(--line-2);border-radius:4px;padding:0 6px;color:var(--ink-2);white-space:nowrap}
.tag.warn{border-color:var(--st-serious);color:var(--ink)}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.sbox span{font-size:12px;color:var(--ink-3);font-weight:600}
.sbox b{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15}
.sbox.alert b{color:var(--crit-ink)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toolbar input[type=search]{max-width:260px;padding:6px 10px;font-size:14px}
.grow{flex:1}

/* list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lhead,.row{display:grid;grid-template-columns:118px minmax(0,1fr) 128px 86px 112px;gap:14px;align-items:center;padding:12px 16px}
.lhead{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.04em;border-bottom:1px solid var(--line);background:var(--surface-2)}
.row{border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.r-no{font-size:12.5px;color:var(--ink-2)}
.r-main{min-width:0;display:grid;gap:2px}
.r-title{font-weight:600;overflow-wrap:anywhere}
.r-meta{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.r-due{display:grid;font-size:13px;line-height:1.4}
.r-due small{font-size:12px;color:var(--ink-3)}
.r-due small.crit{color:var(--crit-ink);font-weight:700}
.r-due small.warn{color:var(--warn-ink);font-weight:700}
.row select{padding:4px 8px;font-size:13px}
.empty{padding:40px 20px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--ink-2)}
.empty b{font-size:16px;color:var(--ink)}
@media (max-width:760px){
  .lhead{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main status" "due urg" "no no";gap:6px 12px}
  .r-main{grid-area:main}.r-st{grid-area:status;justify-self:end}.r-due{grid-area:due}.r-urg{grid-area:urg;justify-self:end}.r-no{grid-area:no}
  .r-due{display:flex;gap:8px;align-items:baseline}
}


/* path / link lists */
.links{display:grid;gap:8px}
.lk-rows{display:grid;gap:8px}
.lk-row{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:center}
.links>.btn{justify-self:start}
.lk-in{font-size:13px!important}
.linklist{display:grid;gap:6px;min-width:0}
.linklist a{overflow-wrap:anywhere}
/* spec line items */
.items{display:grid;gap:8px}
.it-head,.it-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 76px minmax(0,1.4fr) 34px;gap:8px;align-items:center}
.it-head{font-size:12px;color:var(--ink-3);font-weight:600}
.it-rows{display:grid;gap:8px}
.it-row input{padding:7px 9px;font-size:14px}
.it-del{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;width:34px;height:36px;cursor:pointer;color:var(--ink-3);font-size:17px;line-height:1}
.it-del:hover{color:var(--crit-ink);border-color:var(--st-crit)}
.items>.btn{justify-self:start}
.it-table{width:100%;min-width:0;font-size:13px}
.it-table td{padding:5px 8px}
@media (max-width:640px){
  .it-head{display:none}
  .it-row{grid-template-columns:minmax(0,1fr) 84px 34px;grid-template-areas:"name name del" "size qty qty" "note note note";padding:10px;border:1px solid var(--line);border-radius:10px}
  .it-name{grid-area:name}.it-size{grid-area:size}.it-qty{grid-area:qty}.it-note{grid-area:note}.it-del{grid-area:del}
}
/* sortable headers */
.sorth{appearance:none;border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-align:left}
.sorth i{font-style:normal;font-size:10px;opacity:0;transition:opacity .15s}
.sorth:hover i,.sorth:focus-visible i{opacity:.5}
.sorth[aria-sort="ascending"] i,.sorth[aria-sort="descending"] i{opacity:1;color:var(--accent)}
.sorth[aria-sort="ascending"],.sorth[aria-sort="descending"]{color:var(--ink)}
.msort{display:none;width:auto;padding:5px 8px;font-size:13px}
@media (max-width:760px){ .msort{display:inline-block} }
.row.busy{cursor:default}
.row.busy:hover{background:transparent}

.pgroups{display:grid;gap:8px}
.pgroup{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start}
.pg-l{font-size:12px;font-weight:700;color:var(--ink-3);padding-top:4px}
@media (max-width:520px){ .pgroup{grid-template-columns:minmax(0,1fr);gap:4px} }
table.wk{min-width:1280px}
table.wk td{padding:6px 6px;vertical-align:top}
table.wk textarea,table.wk select,table.wk input{font-size:13px;padding:5px 7px;min-height:0}
table.wk textarea{min-width:140px;resize:vertical;line-height:1.5}
table.wk td:nth-child(1) select{width:96px}
table.wk td:nth-child(6) select{width:112px}
.capgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.capcell{border-radius:14px;padding:18px 20px;display:grid;gap:4px;border:1px solid var(--line)}
.capcell b{font-size:40px;line-height:1.1;font-weight:800;font-family:var(--f-display)}
.cap-k{font-size:13px;font-weight:700;opacity:.85}
.cap-d,.cap-h{font-size:13px;opacity:.85}
.strip2{display:grid;gap:12px}
.strip-w{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.strip-d{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dcell{border-radius:8px;padding:8px;display:grid;gap:2px;font-size:12px;border:1px solid var(--line);min-width:0}
.dcell b{font-size:15px}
.dcell small{font-size:11px;opacity:.85}
.dcell.off{background:var(--surface-2);color:var(--ink-3);border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--ink-2)}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:12px;border-radius:3px;border:1px solid var(--line)}
.sharebar{display:block;width:120px;height:8px;border-radius:999px;background:var(--grid);overflow:hidden}
.sharebar i{display:block;height:100%;background:var(--st-crit);border-radius:999px}
input.cap-ov{width:84px;padding:4px 8px;font-size:13px}
ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}

function dueInfo(x){
  if (x.status === 'Done') return {txt: x.t.deliveredDate ? `${showD(x.t.deliveredDate)} 交件` : '已完成', cls:''};
  const due = parseD(x.r.dueDate);
  if (!due) return {txt:'', cls:''};
  if (!isActive(x.status)) return {txt:'', cls:''};
  const diff = Math.round((due - today0())/864e5);
  if (diff < 0) return {txt:`逾期 ${-diff} 天`, cls:'crit'};
  if (diff === 0) return {txt:'今天到期', cls:'warn'};
  return {txt:`剩 ${diff} 天`, cls: diff <= 2 ? 'warn' : ''};
}
const statusPill = s => `<span class="pill ${STATUS[s].tone}">${STATUS[s].zh}</span>`;
const urgPill = u => URG[u] ? `<span class="pill ${URG[u].tone}">${URG[u].zh}</span>` : '';
function rowMeta(r){
  return [CAT[r.category]?.zh, (r.channels || []).join('、'), r.planner, r.company].filter(Boolean).map(esc).join(' · ');

const SORT_KEYS = {
  no: x => x.r.createdAt || x.r.no || '',
  title: x => x.r.title || '',
  due: x => x.r.dueDate || x.t.deliveredDate || '',
  urg: x => ({super:3, rush:2, normal:1})[x.r.urgency] || 0,
  status: x => ['Delay','On going','Open','Postponed','Done','Cancel','Withdrawn'].indexOf(x.status) + 1,
};
const SORT_COLS = [['no','編號'],['title','專案'],['due','完稿日'],['urg','等級'],['status','狀態']];
function listHead(st){
  return `<div class="lhead">${SORT_COLS.map(([k, l]) => { const on = st.sort && st.sort.key === k; const dir = on ? st.sort.dir : null;
    return `<span><button type="button" class="sorth" data-sort="${k}" aria-sort="${dir === 'asc' ? 'ascending' : dir === 'desc' ? 'descending' : 'none'}" title="點一下排序">${l}<i>${dir === 'desc' ? '▼' : '▲'}</i></button></span>`; }).join('')}</div>`;
}
function sortSelect(st, id){
  const cur = st.sort ? st.sort.key + ':' + st.sort.dir : '';
  const opts = [['','預設排序'],['due:asc','完稿日 近→遠'],['due:desc','完稿日 遠→近'],['no:desc','最新送單'],['no:asc','最早送單'],['title:asc','專案名稱'],['urg:desc','等級 急→緩'],['status:asc','狀態']];
  return `<select class="msort" id="${id}" aria-label="排序">${opts.map(([v, l]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
}
function sortRows(rows, sort){
  if (sort && SORT_KEYS[sort.key]){
    const f = SORT_KEYS[sort.key], m = sort.dir === 'desc' ? -1 : 1;
    return rows.sort((a, b) => {
      const va = f(a), vb = f(b); const ea = va === '' || va === 0, eb = vb === '' || vb === 0;
      if (ea !== eb) return ea ? 1 : -1;
      const c = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), 'zh-Hant');
      return c ? c * m : (a.r.dueDate || '').localeCompare(b.r.dueDate || '');
    });
  }
  return rows.sort((a, b) => {
    const aa = isActive(a.status) ? 0 : 1, bb = isActive(b.status) ? 0 : 1;
    if (aa !== bb) return aa - bb;
    const da = a.r.dueDate || a.t.deliveredDate || '9999', dbb = b.r.dueDate || b.t.deliveredDate || '9999';
    return aa === 0 ? da.localeCompare(dbb) : dbb.localeCompare(da);
  });
}
function filterBy(rows, st, q){
  let out = rows;
  if (st === 'active') out = out.filter(x => isActive(x.status));
  else if (st === 'closed') out = out.filter(x => x.status === 'Cancel' || x.status === 'Withdrawn');
  else if (st !== 'all') out = out.filter(x => x.status === st);
  if (q){ const k = q.toLowerCase(); out = out.filter(x => [x.r.no, x.r.title, x.r.planner, x.r.specs, x.r.proposal, x.r.company].some(s => String(s || '').toLowerCase().includes(k))); }
  return out;
}

function getPresets(){
  const sp = S.settings.presets;
  if (Array.isArray(sp) && sp.length) return sp.filter(x => x && x.name && x.size).map(x => [Array.isArray(x.ch) ? x.ch : [String(x.ch || '其他')], x.name, x.size]);

function parsePresets(text){
  const out = [], bad = [];
  String(text).split(/\n+/).map(l => l.trim()).filter(Boolean).forEach(l => {
    const parts = l.split(/\s*[|｜\t]\s*/);
    if (parts.length < 3){ bad.push(l); return; }
    const ch = parts[0].split(/[\/／、,，]/).map(c => c.trim()).filter(Boolean);
    const size = normSize(parts.slice(2).join(' '));
    if (!ch.length || !parts[1] || !size){ bad.push(l); return; }
    out.push({ch, name:parts[1].trim(), size});
  });
  return {out, bad};
}

async function writeTrack(id, patch){

  const prev = S.track.get(id) || {};
  const doc = {...prev, ...patch, updatedAt:new Date().toISOString()};
  S.track.set(id, doc);
  try { await enqueue('track/' + id, () => S.db.doc('track/' + id).set(doc)); return true; }
  catch(e){ handleWriteError(e); return false; }
}
function snapshotOf(r){
  const keys = ['no','title','proposal','company','category','channels','qty','planner','briefDate','dueDate','launchDate','createdAt','urgency','leadDays','offSchedule','backfill','rating','edits'];
  const o = {}; for (const k of keys) o[k] = r[k] ?? null; return o;
}
async function writeKpi(id, patch){

  const r = S.requests.get(id) || prev.snapshot; if (!r) return false;
  const doc = {difficulty:'normal', revisions:0, points:null, delayCause:'', hours:null, include:true, note:'', ...prev, ...patch, snapshot:snapshotOf(r), updatedAt:new Date().toISOString()};
  S.kpi.set(id, doc);

async function quickStatus(id, st){

    if (await writeManual(id, doc)){ toast(`已改為「${STATUS[st].zh}」`); loadStatusSync(id, st); } else renderCurrent();

  else renderCurrent();
}

    if (st === 'On going' && prev === 'Open' && stg && !stg.value) stg.value = '初稿製作中';
    f.dataset.prev = st;
  }

  const hint = $('.js-stage-hint', f);

  }

  const late = lateOf(due, del ? del.value : '', st);

function hash5(str){ let h = 0x811c9dc5; for (const ch of str){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36).toUpperCase().padStart(5, '0').slice(-5); }
function parseLog(text, year){
  const t = today0(); const out = []; const seen = new Set();
  for (const raw of String(text).split(/\r?\n/)){
    const m = /^(\d{1,2})\/(\d{1,2})\s*(.+)$/.exec(raw.trim()); if (!m) continue;
    const mo = +m[1], d = +m[2]; const date = new Date(year, mo - 1, d);
    if (mo < 1 || mo > 12 || date.getMonth() !== mo - 1) continue;
    const title = m[3].trim();
    let qty = 0; for (const q of title.matchAll(/[*＊×xX]\s*(\d{1,3})(?!\d)/g)) qty += +q[1];
    const cat = (LOG_CAT_RULES.find(([re]) => re.test(title)) || [null, 'ads'])[1];
    const bu = (S.settings.companies || []).find(c => c && title.includes(c)) || '';
    const ch = LOG_CH_RULES.filter(([re]) => re.test(title)).map(c => c[1]);
    const ds = fmtD(date);
    let id = `L${ds.slice(2).replaceAll('-', '')}-${hash5(title)}`; while (seen.has(id)) id += 'b'; seen.add(id);
    out.push({id, date:ds, title, cat, qty:qty || 1, bu, ch, status: date >= t ? 'On going' : 'Done', include:!/考核繳交/.test(title), on:true});
  }
  return out;
}

const WTYPES = ['重要專案','專案','其他'];
const WSTATUS = ['on time','done','not started','delay','postponed'];
const defaultWType = cat => ({web:'重要專案', tool:'重要專案', kv:'專案', print:'專案', slides:'專案', flow:'專案', motion:'專案'})[cat] || '其他';
function nextFriday(){ const t = today0(); return addDays(t, (5 - t.getDay() + 7) % 7); }
const fmtSlash = s => { const d = parseD(s); return d ? `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}` : ''; };
function wAuto(x){
  const r = x.r, t = x.t;
  let content;
  const cap = lines => lines.length > 4 ? [...lines.slice(0, 3), `…等 ${lines.length} 項規格`] : lines;
  if (Array.isArray(r.items) && r.items.length){
    const lines = r.items.map(it => [it.name, it.size, it.qty ? '×' + it.qty : ''].filter(Boolean).join(' '));
    content = cap(lines.length > 1 ? lines.map((l, i) => `${i+1}. ${l}`) : lines).join('\n');
  } else if (r.specs && !x.manual) content = cap(String(r.specs).split(/\n+/).filter(Boolean)).join('\n');
  else content = `${CAT[r.category]?.zh || ''}${num(r.qty, 1) > 1 ? ' ×' + num(r.qty, 1) : ''}`;
  let status;
  if (x.status === 'Done') status = 'done';
  else if (x.status === 'Delay') status = 'delay';
  else if (x.status === 'Postponed') status = 'postponed';
  else if (x.status === 'Open' && !t.stage) status = 'not started';
  else { const d = parseD(r.dueDate); status = d && d < today0() ? 'delay' : 'on time'; }
  const L = S.load.has(x.id) ? normLoad(S.load.get(x.id)) : null;
  const pct = L && L.progress != null && L.progress !== '' && isActive(x.status) ? `（${L.progress}%）` : '';
  const progress = x.status === 'Done' ? (t.stage || '已交件') : (t.stage || (pct ? '製作中' : '-')) + pct;
  let next = '-';
  if (isActive(x.status) && x.status !== 'Postponed'){
    const fri = parseD(S.weekFri) || nextFriday(); const d = parseD(t.eta || r.dueDate);
    if (d && d <= fri) next = '完稿交件';
    else if (d && d <= addDays(fri, 7)) next = `${d.getMonth() + 1}/${d.getDate()} 完稿`;
  }
  return {type:defaultWType(r.category), title:r.title || '', content, progress, blocker:'無', status, due:fmtSlash(t.eta || r.dueDate || t.deliveredDate) || 'TBC', next};
}
function weeklyRows(){
  const fri = parseD(S.weekFri) || nextFriday(); const from = addDays(fri, -6);
  const order = t => WTYPES.indexOf(t);
  return allRows(true).filter(x => !x.gone && x.status !== 'Withdrawn' && x.status !== 'Cancel')
    .filter(x => !(x.k && x.k.weekly && x.k.weekly.hide))
    .filter(x => { if (isActive(x.status)) return true; if (x.status === 'Done'){ const d = parseD(x.t.deliveredDate); return d && d >= from && d <= fri; } return false; })
    .map(x => { const a = wAuto(x); const w = (x.k && x.k.weekly) || {}; const v = {}; for (const k of Object.keys(a)) v[k] = (w[k] !== undefined && w[k] !== '') ? w[k] : a[k]; return {x, v, a}; })
    .sort((p, q) => (order(p.v.type) - order(q.v.type)) || String(p.x.r.dueDate || '9999').localeCompare(String(q.x.r.dueDate || '9999')));
}

  if (startD > dueD) startD = dueD;
  const winDays = workdaysIn(startD, dueD); if (!winDays.length) winDays.push(fmtD(dueD));
  const futureWin = winDays.filter(ds => ds >= tds);
  const overdue = !futureWin.length;
  let days = futureWin;
  if (overdue){ days = workdaysIn(t, addDays(monOf(t), 4)); if (!days.length) days = [fmtD(nextWorkday(t))]; }
  const rAt = parseD(L.remainingAt);

  let remNow;
  if (reported){
    const later = L.adjustments.filter(a => L.remainingTs ? String(a.at || '') > L.remainingTs : String(a.at || '').slice(0, 10) > L.remainingAt).reduce((s, a) => s + num(a.delta), 0);

    else { const span = workdaysIn(rAt > startD ? rAt : startD, dueD); const past = span.filter(ds => ds < tds).length; remNow = span.length ? base * (1 - past / span.length) : base; }

async function writeLoad(id, patch){
  if (writeBlocked()) return false;

  const x = findRow(id);
  const prev = S.load.has(id) ? normLoad(S.load.get(id)) : {adjustments:[], alloc:{}, window:{start:'', end:''}};
  const snap = x ? {no:x.r.no || id, title:x.r.title || '', dueDate:x.r.dueDate || '', category:x.r.category || '', status:x.status} : {};
  const doc = {...prev, ...snap, ...patch, updatedAt:new Date().toISOString()};
  delete doc.startDate; delete doc.overrides;
  Object.keys(doc).forEach(k => { if (doc[k] === undefined) delete doc[k]; });
  S.load.set(id, doc);
  try { await enqueue('load/' + id, () => S.db.doc('load/' + id).set(doc)); return true; }
  catch(e){ handleWriteError(e); return false; }
}

  return `<div class="private dw-sec">${head}${sumBox}${sugBox}${doneBox}${S.loadEdit ? editor + adjBox : (adjList ? `<div class="field"><span class="lbl">工時調整</span>${adjList}</div>` : '') + editor}</div>`;
}

/* ---------------- KPI ---------------- */
function currentPeriod(){ const t = today0(); return {y:t.getFullYear(), h: t.getMonth() < 6 ? 1 : 2}; }
function periodRange(p){ return p.h === 1 ? [new Date(p.y,0,1), new Date(p.y,5,30)] : [new Date(p.y,6,1), new Date(p.y,11,31)]; }
const periodLabel = p => `${p.y} ${p.h === 1 ? '上半年（1/1–6/30）' : '下半年（7/1–12/31）'}`;
function kpiCompute(p){
  const [ps, pe] = periodRange(p);
  const all = allRows(true);
  const counted = all.filter(x => x.status !== 'Withdrawn' && x.status !== 'Cancel' && !(x.k && x.k.include === false));
  const inP = counted.filter(x => {
    const ds = x.status === 'Done' ? (x.t.deliveredDate || x.r.dueDate) : x.r.dueDate;
    const d = parseD(ds); return d && d >= ps && d <= pe;
  });
  const done = inP.filter(x => x.status === 'Done');
  const timed = done.filter(x => x.t.deliveredDate && x.r.dueDate);
  const late = timed.filter(x => x.t.deliveredDate > x.r.dueDate);
  const excused = late.filter(x => x.k && (x.k.delayCause === 'requester' || x.k.delayCause === 'force'));
  const denom = timed.length - excused.length;
  const onTimeRate = denom > 0 ? (timed.length - late.length) / denom * 100 : null;
  const manualN = inP.filter(x => x.manual).length;
  const rated = done.filter(x => num(x.r.rating) > 0);
  const satisfaction = rated.length ? rated.reduce((s, x) => s + num(x.r.rating), 0) / rated.length : null;
  const points = done.reduce((s, x) => s + pointsOf(x.r, x.k), 0);
  const revisions = done.length ? done.reduce((s, x) => s + num(x.k?.revisions), 0) / done.length : null;
  const urgent = inP.filter(x => x.r.urgency === 'rush' || x.r.urgency === 'super');
  const superN = inP.filter(x => x.r.urgency === 'super').length;
  const off = inP.filter(x => x.r.offSchedule).length;
  const changes = inP.reduce((s, x) => s + num(x.r.edits), 0);
  const leads = done.map(x => {
    const c = x.r.createdAt ? day0(new Date(x.r.createdAt)) : null; const b = parseD(x.r.briefDate); const dl = parseD(x.t.deliveredDate);
    if (!b || !dl) return null; const st = c && c > b ? c : b; return workdays(st, dl);
  }).filter(n => n != null && n >= 0);
  const avgLead = leads.length ? leads.reduce((a, b) => a + b, 0) / leads.length : null;
  const hours = done.reduce((s, x) => s + num(x.k?.hours), 0);
  // months
  const months = [];
  for (let i = 0; i < 6; i++){ const m = (p.h === 1 ? 0 : 6) + i; months.push({m, label:`${m+1}月`, n:0, pts:0}); }
  for (const x of done){ const d = parseD(x.t.deliveredDate || x.r.dueDate); if (!d) continue; const mo = months.find(o => o.m === d.getMonth()); if (mo){ mo.n++; mo.pts += pointsOf(x.r, x.k); } }
  // categories
  const cats = CATS.map(c => ({k:c.k, zh:c.zh, n:0, done:0, pts:0}));
  for (const x of inP){ const c = cats.find(o => o.k === x.r.category) || cats[cats.length-1]; c.n++; if (x.status === 'Done'){ c.done++; c.pts += pointsOf(x.r, x.k); } }
  // planners
  const pl = new Map();
  for (const x of inP){ const key = x.r.planner || (x.manual ? '自行登錄（未記錄企劃）' : '（未填）'); const o = pl.get(key) || {name:key, n:0, urgent:0, ratings:[], off:0}; o.n++; if (x.r.urgency === 'rush' || x.r.urgency === 'super') o.urgent++; if (x.r.offSchedule) o.off++; if (num(x.r.rating) > 0) o.ratings.push(num(x.r.rating)); pl.set(key, o); }
  const T = S.kpiconf.targets;
  const inds = [
    {k:'onTime', zh:'準時交件率', val:onTimeRate, better:'high', fmt:v => v.toFixed(1) + '%', tfmt:v => v + '%', foot: timed.length ? `有完稿日的結案 ${timed.length} 件，逾期 ${late.length} 件${excused.length ? `（${excused.length} 件為需求端／不可抗力，已排除）` : ''}` : '本期結案都沒有完稿日，無法計算'},
    {k:'satisfaction', zh:'需求者滿意度', val:satisfaction, better:'high', fmt:v => v.toFixed(2), tfmt:v => v + ' 分', foot: rated.length ? `${rated.length} 件評分，滿分 5 分` : '尚無企劃評分'},
    {k:'points', zh:'工作量點數', val: done.length ? points : null, better:'high', fmt:v => r1(v) + ' 點', tfmt:v => v + ' 點', foot:'依類別點數 × 數量 × 難度計算'},
    {k:'revisions', zh:'平均修改次數', val:revisions, better:'low', fmt:v => v.toFixed(1) + ' 次', tfmt:v => '≤ ' + v + ' 次', foot:'越低越好；未填視為 0 次'},
  ].map(o => {
    const t = T[o.k] || {target:1, weight:0}; let ach = null;
    if (o.val != null && num(t.target) > 0){ ach = o.better === 'high' ? Math.min(o.val / t.target, 1) : (o.val <= t.target ? 1 : t.target / o.val); }
    return {...o, target:num(t.target), weight:num(t.weight), ach};
  });
  const wsum = inds.filter(o => o.ach != null).reduce((s, o) => s + o.weight, 0);
  const score = wsum > 0 ? inds.filter(o => o.ach != null).reduce((s, o) => s + o.weight * o.ach, 0) / wsum * 100 : null;
  const estDone = done.reduce((s, x) => s + (S.load.has(x.id) ? effTotal(S.load.get(x.id)) : 0), 0);
  const adjBy = {}; let adjUp = 0;
  for (const [, L0] of S.load) for (const a of normLoad(L0).adjustments){ const d = parseD(String(a.at || '').slice(0, 10)); if (d && d >= ps && d <= pe){ const v = num(a.delta); adjBy[a.reason || '其他'] = (adjBy[a.reason || '其他'] || 0) + v; if (v > 0) adjUp += v; } }
  return {estDone, adjBy, adjUp, p, ps, pe, inP, done, timed, manualN, late, excused, onTimeRate, satisfaction, rated, points, revisions, urgent, superN, off, changes, avgLead, hours, months, cats, planners:[...pl.values()].sort((a,b) => b.n - a.n), inds, score};
}
function summaryText(K){
  const topCat = [...K.cats].sort((a,b) => b.n - a.n)[0];
  const lines = [];
  lines.push(`${periodLabel(K.p)}共處理 ${K.inP.length} 件設計工作${K.manualN ? `（需求單 ${K.inP.length - K.manualN} 件、自行登錄 ${K.manualN} 件）` : ''}，結案 ${K.done.length} 件，工作量合計 ${r1(K.points)} 點。`);
  if (K.onTimeRate != null) lines.push(`準時交件率 ${K.onTimeRate.toFixed(1)}%${K.excused.length ? `（已排除需求端資料延遲或不可抗力 ${K.excused.length} 件）` : ''}。`);
  if (K.inP.length) lines.push(`急件與特急件 ${K.urgent.length} 件，占 ${(K.urgent.length / K.inP.length * 100).toFixed(0)}%${K.superN ? `，其中特急件 ${K.superN} 件` : ''}；未於排程截止前送單的插件 ${K.off} 件。`);
  if (topCat && topCat.n) lines.push(`需求以「${topCat.zh}」${topCat.n} 件最多。`);
  if (K.satisfaction != null) lines.push(`需求者平均滿意度 ${K.satisfaction.toFixed(2)} / 5（${K.rated.length} 件評分）。`);
  if (K.revisions != null) lines.push(`平均修改 ${K.revisions.toFixed(1)} 次${K.changes ? `，製作期間需求變更 ${K.changes} 次` : ''}。`);
  if (K.avgLead != null) lines.push(`平均製作 ${K.avgLead.toFixed(1)} 個工作天。`);
  if (K.estDone){ const ups = Object.entries(K.adjBy).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]); lines.push(`結案工作預估工時合計 ${r1(K.estDone)} 小時${ups.length ? `，製作期間因${ups.map(([k, v]) => `${k} +${r1(v)}h`).join('、')}而增加` : ''}。`); }
  if (K.score != null) lines.push(`綜合 KPI 分數 ${K.score.toFixed(1)} / 100。`);
  return lines.join('\n');
}
function monthChart(K){
  const W = 560, H = 210, padL = 30, padB = 28, padT = 22, plotH = H - padB - padT;
  const max = Math.max(1, ...K.months.map(m => m.n));
  const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : 10;
  const top = Math.ceil(max / step) * step;
  const y = v => padT + plotH - (v / top) * plotH;
  const band = (W - padL) / 6, bw = 24;
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="gl" x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end" class="mono" style="font-size:11px">${v}</text>`;
  const cols = K.months.map((m, i) => {
    const cx = padL + band * i + band / 2; const h = (m.n / top) * plotH; const x0 = cx - bw / 2, y0 = padT + plotH - h;
    const r = Math.min(4, h);
    const path = h > 0 ? `<path class="col" d="M${x0},${padT + plotH} V${y0 + r} Q${x0},${y0} ${x0 + r},${y0} H${x0 + bw - r} Q${x0 + bw},${y0} ${x0 + bw},${y0 + r} V${padT + plotH} Z"/>` : '';
    const tip = `${m.label}：結案 ${m.n} 件 · ${r1(m.pts)} 點`;
    return `${path}${m.n ? `<text class="val" x="${cx}" y="${y0 - 6}" text-anchor="middle">${m.n}</text>` : ''}<text x="${cx}" y="${H - 8}" text-anchor="middle">${m.label}</text><rect class="hit" x="${padL + band * i}" y="${padT}" width="${band}" height="${plotH}" data-tip="${esc(tip)}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每月結案件數">${g}${cols}</svg>`;
}
function catBars(K){
  const list = K.cats.filter(c => c.n > 0).sort((a,b) => b.n - a.n);

  const cell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = K.inP.map(x => {
    const late = x.t.deliveredDate && x.r.dueDate ? (x.t.deliveredDate > x.r.dueDate ? '否' : '是') : '';

async function importBackup(file){
  const msg = $('.js-backup-msg');
  if (writeBlocked()) return;
  let data; try { data = JSON.parse(await file.text()); } catch(e){ msg.textContent = '檔案不是有效的 JSON。'; return; }
  if (!data || data.format !== 'design-request-backup' || !data.collections){ msg.textContent = '這不是本工具匯出的備份檔。'; return; }
  const entries = [];
  for (const [col, docs] of Object.entries(data.collections)){
    if (!['requests','track','kpi','busy','settings','kpiconf','counters'].includes(col)) continue;
    for (const [id, d] of Object.entries(docs || {})) if (d && typeof d === 'object' && /^[A-Za-z0-9_.~:@+-]{1,200}$/.test(id)) entries.push([col + '/' + id, d]);
  }
  msg.textContent = `匯入中…（共 ${entries.length} 筆）`;
  try { await S.db.batchSet(entries); msg.textContent = `已匯入 ${entries.length} 筆資料。`; toast('匯入完成'); }
  catch(e){ msg.textContent = '匯入失敗：請確認你已用設計窗口的 Google 帳號登入。'; }
}

function makeDemo(){
  let seed = 20261124; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const planners = ['企劃 A','企劃 B','企劃 C','企劃 D','企劃 E'];
  const titles = {web:['聖誕節活動頁','會員日活動頁','週年慶主題頁'], webupd:['常態頁資訊更新','信用卡優惠頁更新'], ads:['雙11 檔期廣宣素材','週年慶 GDN 素材','新品上市 META 廣告','LINE 推播圖'], kv:['週年慶主視覺','跨年檔期 KV'], resize:['週年慶 KV 延伸尺寸','雙11 素材 Resize'], motion:['全館免運動態素材'], flow:['會員集點流程圖','APP 功能說明圖'], tool:['抽獎小工具','禮品試算工具'], retouch:['商品去背修圖','宣傳情境圖'], print:['櫃位桌卡','活動 DM'], slides:['月會簡報'], other:['活動簽名軸']};
  const weights = ['ads','ads','ads','ads','resize','resize','resize','kv','web','webupd','webupd','motion','print','flow','retouch','retouch','slides','tool','other'];
  const requests = new Map(), track = new Map(), kpi = new Map();
  const t0 = today0();
  for (let i = 0; i < 46; i++){
    const created = addDays(new Date(2026, 6, 1), Math.floor(rnd() * 140));
    if (created > t0) continue;
    const cat = pick(weights);
    const brief = addDays(created, Math.floor(rnd() * 6));
    const lead = pick([2,3,4,5,5,6,7,8,9,10,12]);
    let due = new Date(brief), n = 0; while (n < lead){ due = addDays(due, 1); if (isWorkday(due)) n++; }
    const id = `${fmtD(created).slice(2).replaceAll('-','')}-EX${pad(i)}`;
    const qty = cat === 'ads' || cat === 'resize' || cat === 'retouch' ? 1 + Math.floor(rnd() * 8) : cat === 'web' ? 1 + Math.floor(rnd() * 3) : 1;
    const createdAt = new Date(created); createdAt.setHours(9 + Math.floor(rnd() * 8), Math.floor(rnd() * 60));
    const r = {no:id, title:'（範例）' + pick(titles[cat]), proposal:'', company:'', category:cat, channels: cat === 'ads' ? ['官網','IG','FB'].slice(0, 1 + Math.floor(rnd() * 3)) : cat === 'print' ? ['實體輸出'] : ['官網'],
      specs:'範例資料', qty, briefDate:fmtD(brief), dueDate:fmtD(due), launchDate:'', planner:pick(planners), filePath:'', refLink:'', notes:'',
      urgency:urgOf(lead), leadDays:lead, offSchedule: rnd() < 0.18, approved: lead < 3, createdAt:createdAt.toISOString(), createdBy:null, edits: rnd() < 0.2 ? 1 + Math.floor(rnd() * 2) : 0, withdrawn:false, rating:null, ratingNote:''};
    let status = 'Done', delivered = '';
    if (due >= t0) status = pick(['Open','On going','On going','Postponed']);
    else if (rnd() < 0.05) status = 'Cancel';
    if (status === 'Done'){
      const late = rnd() < 0.12; delivered = fmtD(late ? addDays(due, 1 + Math.floor(rnd() * 3)) : addDays(due, -Math.floor(rnd() * 2)));
      if (rnd() < 0.6) r.rating = pick([4,4,5,5,5,3]);
    }
    if (status === 'On going' && due < addDays(t0, 2) && rnd() < 0.3) status = 'Delay';
    requests.set(id, r);
    track.set(id, {status, deliveredDate:delivered, eta:'', reply:'', deliverLink:''});
    const lateFlag = delivered && delivered > r.dueDate;
    kpi.set(id, {difficulty:pick(['normal','normal','normal','easy','hard']), revisions:Math.floor(rnd() * 4), points:null, delayCause: lateFlag ? pick(['requester','requester','designer']) : '', hours:null, include:true, note:'', snapshot:snapshotOf(r)});
  }
  return {requests, track, kpi};
}

    $('.it-name', next).focus(); return;
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.row[data-act="open"]')){ ev.preventDefault(); openDrawer(ev.target.dataset.id); }
});
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('toggle', ev => { const id = ev.target && ev.target.id; if (id === 'cap-conf') S.capConfOpen = ev.target.open; else if (id === 'cap-fine') S.capFineOpen = ev.target.open; else if (id === 'own-more' || id === 'man-more') S.moreOpen = ev.target.open; }, true);
// chart tooltip
const tip = $('#tip');
document.addEventListener('pointermove', ev => {
  const el = ev.target.closest && ev.target.closest('[data-tip]');
  if (!el){ tip.hidden = true; return; }
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8); const y = ev.clientY - tip.offsetHeight - 12;
  tip.style.left = x + 'px'; tip.style.top = Math.max(8, y) + 'px';
});
window.addEventListener('hashchange', () => setView(location.hash.slice(1), true));
setInterval(() => { if (S.view === 'new') patchStub(); }, 60000);

/* ---------------- boot ---------------- */
async function boot(){
  refreshHolidays();
  refreshItemNames();
  setView(location.hash.slice(1), true);
  const use = name => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
  const [db, user, downloads] = await Promise.all([use('db'), use('user'), use('downloads')]);
  S.db = db; S.user = user; S.downloads = downloads;
  if (user){
    const [own, id, cw] = await Promise.all([user.isOwner(), user.id(), user.can('data.write')]);
    S.isOwner = !!own; S.uid = id || null; S.canWrite = cw;
    S.isManager = !S.isOwner && !!(user.isManager && await user.isManager());
  }
  S.identityKnown = true;
  (async () => { const r = window.DR && await window.DR.ready; const b = $('#authbtn'); if (!r || !b) return;
    const anon = r.auth.currentUser && r.auth.currentUser.isAnonymous;
    b.hidden = false; b.textContent = anon ? '登入' : '登出';
    b.title = anon ? '設計窗口或主管用 Google 帳號登入' : '登出 Google 帳號';
    b.onclick = () => anon ? window.DR.signIn() : window.DR.signOut();
    if (!anon && !r.owner && !r.manager) toast('這個 Google 帳號沒有設計窗口或主管權限，只能以一般身分使用');
  })();
  if (!db){ S.conn = 'none'; setView(location.hash.slice(1), true); return; }
  S.conn = 'ok';
  const timer = setTimeout(() => { if (!S.loaded.requests){ S.conn = 'slow'; renderNotices(); } }, 10000);
  const fresh = snap => { if (!snap.metadata.fromCache){ clearTimeout(timer); if (S.conn === 'slow'){ S.conn = 'ok'; } } };
  const onErr = e => { clearTimeout(timer); if (e && e.code === 'revoked'){ S.conn = 'none'; } onData(); };
  db.collection('requests').onSnapshot(snap => { S.requests = new Map(snap.docs.map(d => [d.id, d.data()])); S.loaded.requests = true; fresh(snap); onData(); }, onErr);
  db.collection('busy').onSnapshot(snap => { S.busy = new Map(snap.docs.map(d => [d.id, d.data()])); onData(); }, onErr);
  db.collection('track').onSnapshot(snap => { S.track = new Map(snap.docs.map(d => [d.id, d.data()])); S.loaded.track = true; onData(); }, onErr);
  db.doc('settings/main').onSnapshot(snap => {
    if (snap.exists){ S.settings = {...DEFAULT_SETTINGS, ...snap.data()}; refreshHolidays(); fillSetup(); }
    onData();
  }, onErr);
  if (S.isOwner || S.isManager){
    db.collection('load').onSnapshot(snap => { S.load = new Map(snap.docs.map(d => [d.id, d.data()])); S.loaded.load = true; onData(); }, onErr);
    db.doc('loadconf/main').onSnapshot(snap => { if (snap.exists) S.loadconf = {meetingHours:4, leaves:[], ...snap.data()}; S.loaded.loadconf = true; onData(); }, onErr);
  }
  if (S.isOwner){
    db.collection('kpi').onSnapshot(snap => { S.kpi = new Map(snap.docs.map(d => [d.id, d.data()])); S.loaded.kpi = true; onData(); }, onErr);
    db.doc('kpiconf/seen').onSnapshot(snap => {
      if (snap.exists) S.seen = {since:'', ids:{}, ...snap.data()};
      else { S.seen = {since:new Date().toISOString(), ids:{}}; if (!S.demo) enqueue('kpiconf/seen', () => db.doc('kpiconf/seen').set(S.seen)).catch(() => {}); }
      onData();
    }, onErr);
    db.doc('kpiconf/main').onSnapshot(snap => {
      if (snap.exists){ const c = snap.data(); S.kpiconf = {targets:{...DEFAULT_KPICONF.targets, ...(c.targets || {})}, points:{...DEFAULT_KPICONF.points, ...(c.points || {})}, difficulty:{...DEFAULT_KPICONF.difficulty, ...(c.difficulty || {})}}; fillConf(); }
      onData();
    }, onErr);
  }
  setView(location.hash.slice(1), true);
}
boot();
})();
</script>

</body>
</html>
